<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Totally Real Meeting: in a parody call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<script src="shared.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Figtree,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand{display:inline-flex;align-items:center;gap:8px;flex:none}
.wm{font-family:Fredoka,Figtree,sans-serif;font-weight:600;letter-spacing:.01em}
#room{position:relative;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.grid{flex:1;min-height:0;display:grid;gap:8px;padding:12px;grid-auto-rows:minmax(0,1fr);overflow:auto}
.tile{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:120px;transition:outline-color .2s}
.avatar{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600}
.dense .avatar{width:64px;height:64px;font-size:22px}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.name{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);display:flex;align-items:center;gap:4px;padding:3px 4px 3px 8px;border-radius:4px;font-size:13px;z-index:1}
.name .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name button{width:28px;height:24px;flex:none;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ibtn{border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;position:relative}
.lbl{flex-direction:column;gap:3px;font-size:11px;width:64px;height:52px;border-radius:6px}
.lbl:hover{background:rgba(127,127,127,.18)}
.badge{position:absolute;top:4px;right:12px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#C4314B;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.badge:empty{display:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8EA6FF;outline-offset:2px}
#toast{position:fixed;z-index:6;width:min(320px,calc(100% - 32px));padding:12px 14px;border-radius:8px;display:flex;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
.av{width:32px;height:32px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
#chat{position:fixed;z-index:5;top:0;right:0;bottom:0;width:340px;max-width:100%;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.25)}
#chat[hidden]{display:none}
#chat header{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 12px 16px;font-weight:600}
#msgs{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px}
.msg .meta{font-size:12px;opacity:.75}
.msg .text{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
#chat form{display:flex;gap:8px;padding:12px 16px 16px}
#chat input{flex:1;min-width:0;height:44px;padding:0 12px;border-radius:8px}
@media (max-width:420px){.hide-xs{display:none!important}}
@media (min-width:701px){.show-sm{display:none!important}}
@media (max-width:700px){.show-sm{display:flex}.grid{gap:6px;padding:8px}.avatar{width:64px;height:64px;font-size:22px}.name{font-size:12px}.lbl{width:46px!important}.lbl span{display:none}.hide-sm{display:none!important}#toast{left:16px;right:16px!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="room"></div>
<aside id="chat" hidden aria-label="Meeting chat">
<header><span>Meeting chat</span><button class="ibtn" id="chatClose" aria-label="Close chat" style="width:44px;height:44px"></button></header>
<div id="msgs" role="log" aria-live="polite"></div>
<form id="chatForm"><label class="sr" for="chatInput">Type a message</label><input id="chatInput" autocomplete="off" placeholder="Type a message"><button class="ibtn" aria-label="Send" style="width:44px;height:44px;border-radius:8px" id="chatSend"></button></form>
</aside>
<div id="toast" role="status"></div>

<script>
const S = loadSettings();
saveSettings(S);
const params = new URLSearchParams(location.search);
const FAST = params.get('fast') === '1';   /* add &fast=1 to see chat within seconds when demoing */
const skin = S.skin;
const hasLight = skin === 'teams' || skin === 'webex';
const light = hasLight && resolvedTheme(S) === 'light';
const me = (S.name || 'You').trim() || 'You';

const C = {
  teams: light
    ? { stage: '#F0F0F0', bar: '#FFFFFF', line: '#E0E0E0', text: '#242424', muted: '#5C5C5C', tile: '#E6E6E6', self: '#D4D4D4', label: 'rgba(255,255,255,.88)', panel: '#FFFFFF', field: '#F5F5F5', ring: '#5B5FC7', leave: '#C4314B', radius: '6px' }
    : { stage: '#141414', bar: '#1F1F1F', line: '#333333', text: '#FFFFFF', muted: '#C8C8C8', tile: '#292929', self: '#101010', label: 'rgba(0,0,0,.6)', panel: '#1F1F1F', field: '#2B2B2B', ring: '#7F85F5', leave: '#C4314B', radius: '6px' },
  zoom: { stage: '#1A1A1A', bar: '#1A1A1A', line: '#2E2E2E', text: '#FFFFFF', muted: '#BDBDBD', tile: '#242424', self: '#101010', label: 'rgba(0,0,0,.55)', panel: '#242424', field: '#1A1A1A', ring: '#3DDC84', leave: '#E02828', radius: '4px' },
  webex: light
    ? { stage: '#F7F7F7', bar: '#FFFFFF', line: '#DEDEDE', text: '#121212', muted: '#545454', tile: '#E8E8E8', self: '#D4D4D4', label: 'rgba(255,255,255,.88)', panel: '#FFFFFF', field: '#F0F0F0', ring: '#1170CF', leave: '#D4371C', radius: '8px', pill: '#FFFFFF', btn: '#EDEDED', btnOn: '#F8D9D2' }
    : { stage: '#000000', bar: '#121212', line: '#2A2A2A', text: '#FFFFFF', muted: '#B5B5B5', tile: '#1F1F1F', self: '#101010', label: 'rgba(0,0,0,.6)', panel: '#1A1A1A', field: '#262626', ring: '#64B4FA', leave: '#D4371C', radius: '8px', pill: '#262626', btn: '#3A3A3A', btnOn: '#5A1F14' },
  meet: { stage: '#202124', bar: '#202124', line: '#3C4043', text: '#E8EAED', muted: '#BDC1C6', tile: '#3C4043', self: '#151617', label: 'transparent', panel: '#FFFFFF', panelText: '#202124', field: '#F1F3F4', ring: '#8AB4F8', leave: '#EA4335', radius: '8px', btn: '#3C4043' }
}[skin];

document.title = TOPIC_TITLE[S.topic] + ' | ' + SKIN[skin].say;
document.body.style.background = C.stage;

const state = {
  muted: false, camOn: !!S.cam, chatOpen: false, unread: 0, start: Date.now(), full: false,
  people: S.names.slice(0, S.count).map((name, i) => ({ name: name.trim() || 'Guest ' + (i + 1), ...AVATAR[i % AVATAR.length], muted: i % 3 === 1, speaking: false }))
};
let stream = null;

/* ---------- rendering ---------- */
const micIco = s => ico('mic', s || 20, state.muted ? ICONS.slash : '');
const camIco = () => ico('cam', 20, state.camOn ? '' : '<path d="M3 4l18 16"/>');
const fullIco = () => ico(state.full ? 'exitfull' : 'full', 20);
const canFull = !!(document.documentElement.requestFullscreen && document.fullscreenEnabled);
const elapsed = () => { const t = Math.floor((Date.now() - state.start) / 1000); const m = Math.floor(t / 60), s = t % 60; return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0'); };
const clock = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function gridCols(n) {
  if (matchMedia('(max-width:700px)').matches) return n <= 2 ? 1 : 2;
  return n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : n <= 16 ? 4 : 5;
}

function tiles() {
  const n = state.people.length + 1;
  const avatar = (p, ini) => skin === 'meet'
    ? `<span class="avatar" style="background:${p.solid};color:#fff" aria-hidden="true">${esc(ini[0])}</span>`
    : `<span class="avatar" style="background:${p.bg};color:${p.fg}" aria-hidden="true">${esc(ini)}</span>`;
  const self = `<div class="tile" style="background:${state.camOn && stream ? C.self : C.tile};border-radius:${C.radius}">
      ${state.camOn && stream ? '<video id="selfVideo" autoplay muted playsinline></video>' : avatar({ bg: '#E8D7F5', fg: '#3B2353', solid: '#6D28D9' }, initials(me))}
      <span class="name" style="background:${C.label};color:${C.text}"><span class="n">${esc(me)} (You)</span><button data-mute aria-label="${state.muted ? 'Unmute meeting audio' : 'Mute meeting audio'}" aria-pressed="${state.muted}" style="color:${C.text}">${micIco(14)}</button></span></div>`;
  const others = state.people.map((p, i) => {
    const ring = p.speaking && !p.muted && !state.muted ? `outline:${skin === 'zoom' ? 3 : 2}px solid ${C.ring};outline-offset:-2px;` : 'outline:2px solid transparent;';
    return `<div class="tile" style="background:${C.tile};border-radius:${C.radius};${ring}">${avatar(p, initials(p.name))}
      <span class="name" style="background:${C.label};color:${C.text}"><span class="n">${esc(p.name)}</span><button data-p="${i}" aria-label="${p.muted ? 'Unmute' : 'Mute'} ${esc(p.name)}" aria-pressed="${p.muted}" style="color:${C.text}">${ico('mic', 14, p.muted ? ICONS.slash : '')}</button></span></div>`;
  }).join('');
  return `<div class="grid${n > 9 ? ' dense' : ''}" style="grid-template-columns:repeat(${gridCols(n)},minmax(0,1fr))">${self}${others}</div>`;
}

const settingsHref = 'index.html';
const title = esc(TOPIC_TITLE[S.topic]);

function render() {
  const room = document.getElementById('room');
  room.style.background = C.stage; room.style.color = C.text;
  const unread = state.unread ? state.unread : '';
  let html = '';

  if (skin === 'teams') {
    const b = (k, t, attr = '') => `<button class="ibtn lbl" ${attr} style="color:${C.text}">${k}<span>${t}</span></button>`;
    html = `<div style="height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 16px;background:${C.bar};border-bottom:1px solid ${C.line}">
      <div style="display:flex;align-items:center;gap:14px;min-width:0">${brand('teams', 24)}<span class="hide-sm" style="width:1px;height:20px;background:${C.line}"></span><span data-timer class="hide-xs" style="font-weight:600;font-variant-numeric:tabular-nums">${elapsed()}</span><span class="hide-sm" style="width:1px;height:20px;background:${C.line}"></span><span class="hide-sm" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</span></div>
      <div style="display:flex;align-items:center;gap:2px">
        ${b(ico('chat') + `<span class="badge">${unread}</span>`, 'Chat', 'data-chat aria-label="Chat"')}
        <span class="hide-sm" style="display:flex">${b(ico('people'), 'People')}${b(ico('hand'), 'Raise')}${b(ico('smile'), 'React')}${b(ico('view'), 'View')}</span>
        ${canFull ? '<span class="hide-xs" style="display:flex">' + b(fullIco(), 'Full screen', 'data-full aria-label="Full screen"') + '</span>' : ''}
        <a class="ibtn lbl hide-sm" href="${settingsHref}" style="color:${C.text}">${ico('gear')}<span>Settings</span></a>
        <span class="hide-sm" style="width:1px;height:32px;margin:0 6px;background:${C.line}"></span>
        ${b(camIco(), 'Camera', `data-cam aria-pressed="${!state.camOn}"`)}${b(micIco(), state.muted ? 'Unmute' : 'Mic', `data-mute aria-pressed="${state.muted}"`)}<span class="hide-sm" style="display:flex">${b(ico('share'), 'Share')}</span>
        <a href="${settingsHref}" aria-label="Leave" style="margin-left:8px;height:36px;padding:0 12px;border-radius:6px;background:${C.leave};color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none">${ico('phone', 18)}<span class="hide-sm">Leave</span></a>
      </div></div>${tiles()}`;
  }

  if (skin === 'zoom') {
    const b = (k, t, attr = '', col = C.text) => `<button class="ibtn lbl" ${attr} style="color:${col};width:84px">${k}<span style="color:${C.text}">${t}</span></button>`;
    html = `<div style="height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px">
      <span style="display:flex;align-items:center;gap:12px;min-width:0">${brand('zoom', 20)}<span class="hide-sm" style="font-size:12px;color:${C.muted};white-space:nowrap">${title}</span></span>
      <span style="display:flex;gap:6px">${canFull ? `<button class="ibtn" data-full aria-label="Full screen" style="height:32px;padding:0 10px;gap:6px;border-radius:6px;background:#2A2A2A;color:${C.text};font-size:12px">${ico(state.full ? 'exitfull' : 'full', 14)}<span class="hide-sm">${state.full ? 'Exit full screen' : 'Full screen'}</span></button>` : ''}<a class="ibtn" href="${settingsHref}" style="height:32px;padding:0 10px;gap:6px;border-radius:6px;background:#2A2A2A;color:${C.text};font-size:12px">${ico('gear', 14)}<span class="hide-sm">Settings</span></a></span></div>
      ${tiles()}
      <div style="height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:${C.bar};border-top:1px solid ${C.line}">
        <div style="display:flex">${b(micIco(), state.muted ? 'Unmute' : 'Mute', `data-mute aria-pressed="${state.muted}"`, state.muted ? '#E02828' : C.text)}${b(camIco(), state.camOn ? 'Stop Video' : 'Start Video', `data-cam aria-pressed="${!state.camOn}"`, state.camOn ? C.text : '#E02828')}</div>
        <div style="display:flex">${b(ico('people'), 'Participants')}${b(ico('chat') + `<span class="badge" style="right:20px">${unread}</span>`, 'Chat', 'data-chat aria-label="Chat"')}${b(ico('share'), 'Share', '', '#3DDC84')}<span class="hide-sm" style="display:flex">${b(ico('rec'), 'Record')}${b(ico('smile'), 'Reactions')}${b(ico('more'), 'More')}</span></div>
        <a href="${settingsHref}" style="height:34px;padding:0 18px;border-radius:8px;background:${C.leave};color:#fff;font-weight:600;display:inline-flex;align-items:center;text-decoration:none">End</a>
      </div>`;
  }

  if (skin === 'webex') {
    const r = (k, attr = '', bg = C.btn, label = '') => `<button class="ibtn" ${attr} ${label ? `aria-label="${label}"` : ''} style="height:44px;min-width:44px;padding:0 14px;gap:8px;border-radius:22px;background:${bg};color:${C.text}">${k}</button>`;
    html = `<div style="height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 16px;background:${C.bar};border-bottom:1px solid ${C.line}">
      <span style="display:flex;gap:12px;align-items:center;min-width:0">${brand('webex', 24)}<span style="width:1px;height:20px;background:${C.line}"></span><strong class="hide-sm" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</strong><span data-timer style="color:${C.muted};font-variant-numeric:tabular-nums">${elapsed()}</span></span>
      <span style="display:flex;gap:4px"><span class="hide-sm" style="display:flex">${r(ico('view', 18) + '<span class="hide-sm" style="font-size:13px">Layout</span>', '', 'transparent', 'Layout')}</span>${canFull ? r(fullIco(), 'data-full', 'transparent', 'Full screen') : ''}<a class="ibtn" href="${settingsHref}" aria-label="Settings" style="width:44px;height:44px;border-radius:22px;color:${C.text}">${ico('gear', 18)}</a></span></div>
      ${tiles()}
      <div style="height:84px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;padding:0 12px">
        <div style="display:flex;gap:8px;padding:8px;border-radius:32px;background:${C.pill}">
          ${r(micIco() + `<span class="hide-sm" style="font-size:13px">${state.muted ? 'Unmute' : 'Mute'}</span>`, `data-mute aria-pressed="${state.muted}"`, state.muted ? C.btnOn : C.btn)}
          ${r(camIco() + `<span class="hide-sm" style="font-size:13px">${state.camOn ? 'Stop video' : 'Start video'}</span>`, `data-cam aria-pressed="${!state.camOn}"`)}
          ${r(ico('share') + '<span class="hide-sm" style="font-size:13px">Share</span>', '', C.btn, 'Share')}
          <span class="hide-sm" style="display:flex;gap:8px">${r(ico('rec'), '', C.btn, 'Record')}${r(ico('smile'), '', C.btn, 'Reactions')}</span>
          ${r(ico('chat') + `<span class="badge" style="top:-2px;right:-2px">${unread}</span>`, 'data-chat', C.btn, 'Chat')}
          <a href="${settingsHref}" aria-label="Leave meeting" class="ibtn" style="width:44px;height:44px;border-radius:22px;background:${C.leave};color:#fff">${ico('x')}</a>
        </div>
        <span class="hide-sm" style="position:absolute;right:16px;display:flex;gap:6px">${r(ico('people'), '', 'transparent', 'Participants')}</span>
      </div>`;
  }

  if (skin === 'meet') {
    const r = (k, attr = '', bg = C.btn, label = '') => `<button class="ibtn" ${attr} aria-label="${label}" style="width:48px;height:48px;border-radius:24px;background:${bg};color:${C.text}">${k}</button>`;
    html = `<div class="show-sm" style="height:52px;flex:none;align-items:center;justify-content:space-between;padding:0 8px 0 16px">${brand('meet', 22)}<a class="ibtn" href="${settingsHref}" aria-label="Settings" style="width:44px;height:44px;color:${C.text}">${ico('gear')}</a></div>${tiles()}
      <div style="height:80px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 20px">
        <span class="hide-sm" style="display:flex;align-items:center;gap:12px;font-size:15px;white-space:nowrap;min-width:0">${brand('meet', 24)}<span data-clock>${clock()}</span><span style="color:${C.muted}">|</span><span style="overflow:hidden;text-overflow:ellipsis">${title}</span></span>
        <span style="display:flex;gap:10px;margin:0 auto">
          ${r(micIco(), `data-mute aria-pressed="${state.muted}"`, state.muted ? '#EA4335' : C.btn, state.muted ? 'Unmute meeting audio' : 'Mute meeting audio')}
          ${r(camIco(), `data-cam aria-pressed="${!state.camOn}"`, state.camOn ? C.btn : '#EA4335', 'Camera')}
          <span class="hide-sm" style="display:flex;gap:10px">${r(ico('cc'), '', C.btn, 'Captions')}${r(ico('hand'), '', C.btn, 'Raise hand')}${r(ico('share'), '', C.btn, 'Present')}</span>${canFull ? r(fullIco(), 'data-full', C.btn, 'Full screen') : ''}
          <a href="${settingsHref}" aria-label="Leave call" class="ibtn" style="width:64px;height:48px;border-radius:24px;background:${C.leave};color:#fff">${ico('phone', 22)}</a>
        </span>
        <span style="display:flex;gap:4px">${r(ico('chat') + `<span class="badge" style="top:2px;right:2px">${unread}</span>`, 'data-chat', 'transparent', 'Chat')}<a class="ibtn hide-sm" href="${settingsHref}" aria-label="Settings" style="width:48px;height:48px;border-radius:24px;color:${C.text}">${ico('gear')}</a></span>
      </div>`;
  }

  const focusKey = document.activeElement && document.activeElement.closest && document.activeElement.closest('#room') ? focusSignature(document.activeElement) : null;
  room.innerHTML = html;
  const v = document.getElementById('selfVideo'); if (v && stream) v.srcObject = stream;
  if (focusKey) { const el = room.querySelector(focusKey); el && el.focus(); }
}
function focusSignature(el) {
  for (const a of ['data-mute', 'data-cam', 'data-full', 'data-chat']) if (el.hasAttribute(a)) return `[${a}]`;
  if (el.dataset.p) return `[data-p="${el.dataset.p}"]`;
  return null;
}
/* Only the clock text changes each second; avoid full re-renders. */
setInterval(() => {
  document.querySelectorAll('[data-timer]').forEach(e => e.textContent = elapsed());
  document.querySelectorAll('[data-clock]').forEach(e => e.textContent = clock());
}, 1000);

/* ---------- camera (local only) ---------- */
async function startCam() {
  if (stream || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false }); }
  catch (e) { stream = null; state.camOn = false; }
  render();
}
function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

/* ---------- who is "speaking" (until real per-speaker audio exists) ---------- */
function nextSpeaker() {
  const live = state.people.filter(p => !p.muted);
  state.people.forEach(p => p.speaking = false);
  if (live.length) live[Math.floor(Math.random() * live.length)].speaking = true;
  render();
  setTimeout(nextSpeaker, 3000 + Math.random() * 6000);
}

/* ---------- chat ---------- */
const chatEl = document.getElementById('chat'), msgsEl = document.getElementById('msgs'), toastEl = document.getElementById('toast');
chatEl.style.background = C.panel; chatEl.style.color = C.panelText || C.text;
document.getElementById('chatInput').style.cssText += `;background:${C.field};border:1px solid ${C.line}`;
document.getElementById('chatClose').innerHTML = ico('x');
document.getElementById('chatSend').innerHTML = ico('send');
toastEl.style.background = skin === 'meet' ? '#2D2E31' : C.panel; toastEl.style.color = skin === 'meet' ? '#E8EAED' : C.text;
toastEl.style[skin === 'teams' ? 'top' : 'bottom'] = skin === 'teams' ? '76px' : '96px';
toastEl.style.right = '16px';

function addMsg(from, text, av) {
  const row = document.createElement('div'); row.className = 'msg';
  row.innerHTML = `<span class="av" style="background:${av.bg};color:${av.fg}" aria-hidden="true">${esc(initials(from))}</span><div><div class="meta"><strong>${esc(from)}</strong> · ${clock()}</div><div class="text">${esc(text)}</div></div>`;
  msgsEl.appendChild(row); msgsEl.scrollTop = msgsEl.scrollHeight;
}
let toastTimer;
function showToast(from, text, av) {
  toastEl.innerHTML = `<span class="av" style="background:${av.bg};color:${av.fg}" aria-hidden="true">${esc(initials(from))}</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><strong>${esc(from)}</strong><span style="opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(text)}</span></span>`;
  toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 5000);
}
toastEl.addEventListener('click', () => openChat(true));

/* Each pool is shuffled and used up before any line repeats. */
const pools = {};
function draw(key, lines) {
  if (!lines.length) return null;
  if (!pools[key] || !pools[key].length) pools[key] = lines.slice().sort(() => Math.random() - 0.5);
  return pools[key].pop();
}
let lastSender = -1, chatCount = 0;
function pickLine() {
  const mins = (Date.now() - state.start) / 60000 * (FAST ? 20 : 1);
  const phase = mins < 3 ? 'open' : mins > 30 ? 'close' : 'middle';
  const own = S.chat.own ? S.chat.ownText.split('\n').map(t => t.trim()).filter(Boolean) : [];
  const options = [];
  if (S.chat.generic) options.push(() => draw('g-' + phase, CHAT_GENERIC[phase]));
  if (S.chat.topic && phase === 'middle') options.push(() => draw('t', CHAT_TOPIC[S.topic] || []));
  if (own.length && phase === 'middle') options.push(() => draw('o', own));
  if (!options.length && S.chat.generic === false && phase !== 'middle') return null;
  if (!options.length) return null;
  return options[Math.floor(Math.random() * options.length)]();
}
function chatTick() {
  if (state.people.length) {
    const line = pickLine();
    if (line) {
      let i; do { i = Math.floor(Math.random() * state.people.length); } while (state.people.length > 1 && i === lastSender);
      lastSender = i; chatCount++;
      const p = state.people[i];
      addMsg(p.name, line, p);
      if (!state.chatOpen) { state.unread++; showToast(p.name, line, p); render(); }
    }
  }
  scheduleChat();
}
function scheduleChat(first) {
  const [lo, hi] = first ? [20, 45] : S.chat.freq === 'occasional' ? [120, 240] : [240, 360];
  const secs = lo + Math.random() * (hi - lo);
  setTimeout(chatTick, secs * 1000 / (FAST ? 20 : 1));
}
const chatEnabled = S.chat.on && (S.chat.generic || S.chat.topic || S.chat.own);
if (chatEnabled) scheduleChat(true);

function openChat(focus) { state.chatOpen = true; state.unread = 0; chatEl.hidden = false; toastEl.classList.remove('show'); render(); if (focus) document.getElementById('chatInput').focus(); }
function closeChat() { state.chatOpen = false; chatEl.hidden = true; render(); const b = document.querySelector('[data-chat]'); b && b.focus(); }
document.getElementById('chatClose').addEventListener('click', closeChat);
document.getElementById('chatForm').addEventListener('submit', e => {
  e.preventDefault(); const inp = document.getElementById('chatInput'); const t = inp.value.trim(); if (!t) return;
  addMsg(me + ' (You)', t, { bg: '#E8D7F5', fg: '#3B2353' }); inp.value = '';
});

/* ---------- controls ---------- */
function toggleMute() {
  state.muted = !state.muted;
  /* Hook for topic audio: when our own audio files exist, mute/unmute them here. */
  render();
}
document.getElementById('room').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if ('mute' in b.dataset) toggleMute();
  else if ('cam' in b.dataset) { state.camOn = !state.camOn; if (state.camOn) startCam(); else stopCam(); render(); }
  else if (b.dataset.p) { const p = state.people[+b.dataset.p]; p.muted = !p.muted; if (p.muted) p.speaking = false; render(); }
  else if ('full' in b.dataset) { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if ('chat' in b.dataset) { state.chatOpen ? closeChat() : openChat(true); }
});
document.addEventListener('fullscreenchange', () => { state.full = !!document.fullscreenElement; render(); });
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.key === 'Escape' && state.chatOpen) closeChat();
  const shortcut = (skin === 'teams' && e.ctrlKey && e.shiftKey && k === 'm') || (skin === 'zoom' && e.altKey && k === 'a') || (skin === 'meet' && (e.ctrlKey || e.metaKey) && k === 'd') || (skin === 'webex' && e.ctrlKey && k === 'm');
  if (shortcut) { e.preventDefault(); toggleMute(); }
});
addEventListener('resize', () => render());

render();
if (state.camOn) startCam();
setTimeout(nextSpeaker, 1500);
</script>
</body>
</html>
