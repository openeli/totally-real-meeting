<div id="room"></div>

<header><span id="chatTitle">Meeting chat</span><button class="ibtn" data-close aria-label="Close chat" style="width:44px;height:44px"></button></header>
<div id="msgs" class="body" role="log" aria-live="polite"></div>
<form id="chatForm"><label class="sr" for="chatInput">Type a message</label><input id="chatInput" autocomplete="off" placeholder="Type a message"><button class="ibtn" aria-label="Send" style="width:44px;height:44px;border-radius:8px" id="chatSend"></button></form>
</aside>
<aside id="people" class="side" hidden aria-labelledby="peopleTitle">

</aside>

</aside>
<aside id="setSide" class="side" hidden aria-labelledby="setSideTitle">

<div id="confirm" class="scrim" hidden><div class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle" aria-describedby="cfText" id="cf"></div></div>
<div id="toast" role="status"></div>
<div id="notice" role="status" aria-live="polite"></div>

<script>
const S = loadSettings();
saveSettings(S);
const params = new URLSearchParams(location.search);
const FAST = params.get('fast') === '1';   /* add &fast=1 to see chat, reactions and hands within seconds when demoing */
const SPEED = FAST ? 20 : 1;
/* A sound choice (or the comedy with captions) plays one of the prepared meetings in sample/ instead of the scripted captions. */
const SAMPLE_KEY = activeSample(S);
const SAMPLE_INFO = SAMPLE_KEY ? SAMPLES[SAMPLE_KEY] : null;
const SAMPLE = !!SAMPLE_INFO && !!(window.SAMPLE_TIMELINES && SAMPLE_TIMELINES[SAMPLE_INFO.tl || SAMPLE_KEY]);
/* Leave, then Rejoin: the meeting carried on without you, so you come back to where it is now.
   A new meeting, or one that was ended for everyone, starts from the beginning. */
const RESUME_KEY = 'trm-resume-v1', MEETING_ID = JSON.stringify(S);
const RESUMED = (() => {
  let r = null;
  try { r = JSON.parse(sessionStorage.getItem(RESUME_KEY) || 'null'); sessionStorage.removeItem(RESUME_KEY); } catch (e) {}
  const ok = params.get('resume') === '1' && r && r.id === MEETING_ID && Date.now() - r.leftAt < 12 * 3600000;
  if (params.has('resume')) { const u = new URL(location.href); u.searchParams.delete('resume'); history.replaceState(null, '', u.href); }
  return ok ? r : null;
})();
const skin = S.skin;
const hasLight = skin === 'teams' || skin === 'webex' || skin === 'custom';
const CA = S.customApp;
/* The custom look borrows one of three layouts; everything else about it comes from the settings. */
const L = skin === 'custom' ? { top: 'teams', bottom: 'zoom', pill: 'webex' }[CA.layout] : skin;
const me = (S.name || '').trim() || 'Guest';
/* Each app's own typeface (or the closest free one): Segoe UI for Teams, the system font for Zoom, Inter for Webex, Google Sans or Roboto for Meet. */
const FONT = { teams: "'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif", zoom: "-apple-system,BlinkMacSystemFont,'Segoe UI',Lato,'Helvetica Neue',Arial,sans-serif", webex: "Inter,'Segoe UI',-apple-system,system-ui,sans-serif", meet: "'Google Sans',Roboto,Arial,sans-serif" }[skin];
if (FONT) document.body.style.fontFamily = FONT;
document.body.classList.add('skin-' + skin);
const isNarrow = () => matchMedia('(max-width:700px)').matches;
const SITE_URL = new URL('index.html', location.href).href.replace(/index\.html$/, '');

/* ---------- colours: the stage, plus how each app draws its menus, panels and settings ---------- */
let C;
function palette() {

    const grab = st === 'agenda' && WILD && prev !== WILD && live.includes(WILD) && Math.random() < WILD_KIND.floor;   /* the wildcard jumps in */
    const p = nextUp && live.includes(nextUp) ? nextUp : grab ? WILD : fresh[Math.floor(Math.pow(Math.random(), 1.6) * fresh.length)];
    nextUp = null;
    const [lo, hi] = p === WILD ? WILD_KIND.turn : [2, 5];
    turn = { p, left: lo + Math.floor(Math.random() * (hi - lo + 1)), fresh: !!prev && prev !== p };
    if (prev && prev !== p && Math.random() < 0.3) {
      const others = live.filter(x => x !== p && x !== prev);
      if (others.length) return speak(pickOne(others), draw('bc', BACKCHANNEL), () => setTimeout(nextSpeaker, 500 + Math.random() * 700));
    }
    if (prev) return quiet(700 + Math.random() * 1500, sayLine);
  }
  sayLine();
}
function sayLine() {
  if (state.ended) return;
  if (!turn || turn.p.muted || !state.people.includes(turn.p)) return nextSpeaker();
  turn.left--;
  const item = plan.items[Math.max(0, plan.item)];
  const r = Math.random();
  let text;
  if (stage() === 'wrap') text = pickOne(['Sounds good.', 'Works for me.', 'I can take that.', 'I’ll send that over after the call.', 'Yep, on it.']);
  else if (turn.p === WILD && clockMin() - plan.lastWildLine > (ENDIN ? 0.05 : 0.8) && r < 0.7) {
    /* the wildcard's own line, about once a minute; now and then someone answers it and the floor moves on */
    plan.lastWildLine = clockMin();
    text = draw('wild', WILD_KIND.lines);
    const others = state.people.filter(p => p !== WILD && !p.muted);
    if (others.length && Math.random() < 0.35) { queue.push({ p: pickOne(others), text: draw('wildr', WILD_KIND.replies).replace(/\{W\}/g, WILD.name.split(/\s+/)[0]) }); turn.left = 0; }
  }
  else if (turn.fresh && r < 0.22) text = draw('reply', REPLY_LINES);
  else if (item && item.lines.length && r < 0.8) text = draw('item' + plan.item, item.lines);
  else text = draw('everyday', MEETING_LINES);
  turn.fresh = false;
  speak(turn.p, fillSlots(text, { other: otherName(turn.p), you: firstName }), () => setTimeout(nextSpeaker, 250 + Math.random() * 700));
}

/* ---------- other people raise hands and react, rarely and at random ---------- */
const CROWD_REACTS = ['\u{1F44D}', '\u{1F44D}', '\u{1F44F}', '\u{1F602}', '❤️', '\u{1F389}'];
function crowdReact(p, r) {
  if (state.ended || p.react) return;
  p.react = r; render();
  setTimeout(() => { p.react = null; render(); }, 3600);
}
function crowdTick() {
  if (state.ended) return;
  const others = state.people.filter(p => !p.speaking);
  if (others.length) {
    const p = others[Math.floor(Math.random() * others.length)];
    if (SAMPLE || Math.random() < 0.8 || state.people.some(x => x.hand)) {   /* a prepared meeting follows its script: a raised hand would never be called on */
      const r = CROWD_REACTS[Math.floor(Math.random() * CROWD_REACTS.length)];
      crowdReact(p, r);
      /* reactions often come in small clusters, like after good news */
      if (Math.random() < 0.35) others.filter(x => x !== p).sort(() => Math.random() - 0.5).slice(0, 1 + Math.floor(Math.random() * 2))
        .forEach(x => setTimeout(() => crowdReact(x, Math.random() < 0.7 ? r : CROWD_REACTS[0]), (1000 + Math.random() * 3500) / Math.min(SPEED, 4)));
    } else {
      p.hand = true; render(); refreshPanels();
      setTimeout(() => { p.hand = false; nextUp = p; if (turn) turn.left = 0; render(); refreshPanels(); }, (40 + Math.random() * 80) * 1000 / SPEED);
    }
  }
  /* anywhere from about a minute and a half to nine minutes until the next one */
  const mins = Math.min(9, Math.max(1.5, -Math.log(1 - Math.random()) * 4));
  setTimeout(crowdTick, mins * 60000 / SPEED);
}

/* ---------- chat ---------- */

function addMsg(from, text, av) {

  toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 5000);
}

/* Each pool is shuffled and used up before any line repeats. */
const pools = {};
function draw(key, lines) {
  if (!lines.length) return null;
  if (!pools[key] || !pools[key].length) pools[key] = lines.slice().sort(() => Math.random() - 0.5);
  return pools[key].pop();
}
let lastSender = -1, chatTimer = null;
function pickLine() {
  const st = plan ? stage() : 'intro';
  const phase = st === 'intro' ? 'open' : st === 'wrap' || st === 'bye' ? 'close' : 'middle';
  const own = S.chat.own ? S.chat.ownText.split('\n').map(t => t.trim()).filter(Boolean) : [];
  const options = [];
  if (S.chat.generic) options.push(() => draw('g-' + phase, CHAT_GENERIC[phase]));
  if (S.chat.topic && phase === 'middle') options.push(() => draw('t', topicLines(S)));
  if (own.length && phase === 'middle') options.push(() => draw('o', own));
  if (!options.length) return null;
  return options[Math.floor(Math.random() * options.length)]();
}
const chatEnabled = () => S.chat.on && (S.chat.generic || S.chat.topic || S.chat.own);
function chatTick() {
  chatTimer = null;
  if (!chatEnabled() || state.ended) return;
  if (plan && clockMin() >= plan.chatUntil) return;   /* a meeting on a loop: no more chatter, only replies to you */
  if (WILD && state.people.includes(WILD) && plan && stage() === 'agenda' && Math.random() < 0.3) incoming(WILD, draw('wildc', WILD_KIND.chat));
  else if (state.people.length) {
    const line = pickLine();
    if (line) {
      let i; do { i = Math.floor(Math.random() * state.people.length); } while (state.people.length > 1 && i === lastSender);
      lastSender = i;
      incoming(state.people[i], line);
    }
  }
  scheduleChat();
}
function scheduleChat(first) {
  if (chatTimer || !chatEnabled()) return;
  const [lo, hi] = first ? [20, 45] : S.chat.freq === 'occasional' ? [120, 240] : [240, 360];
  chatTimer = setTimeout(chatTick, (lo + Math.random() * (hi - lo)) * 1000 / SPEED);
}
function incoming(p, line) {
  if (state.ended) return;
  addMsg(p.name, line, p);
  if (state.panel !== 'chat') { state.unread++; showToast(p.name, line, p); render(); }
}

/* People answer what you type: a greeting, "can you hear me?", "can you see me?" and so on (rules in shared.js). */
/* Replies use your first name only ("Eli Perry" becomes "Eli"). A guest gets replies without a name. */
const firstName = /^guest$/i.test(me) ? '' : me.split(/\s+/)[0];
function fill(line, other) {
  let t = line.replace(/\{other\}/g, other);
  if (firstName) return t.replace(/\{name\}/g, firstName);
  return t.replace(/, \{name\},/g, ',').replace(/,? \{name\}/g, '').replace(/\{name\}/g, '');
}
const typing = new Set();
function showTyping() {
  let el = document.getElementById('typing');
  if (!typing.size) { el && el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'typing'; el.className = 'meta'; el.style.cssText = 'font-size:12px;opacity:.7;font-style:italic'; el.setAttribute('aria-hidden', 'true'); }
  const names = [...typing];
  el.textContent = names.length > 1 ? `${names[0]} and ${names[1]} are typing…` : `${names[0]} is typing…`;
  msgsEl.appendChild(el); msgsEl.scrollTop = msgsEl.scrollHeight;
}
function replyTo(text) {
  if (!state.people.length) return;
  const rule = CHAT_REPLIES.find(r => r.pattern.test(text));
  if (!rule || Math.random() > (rule.chance ?? 1)) return;
  const pool = rule.when === 'mic' ? rule.lines[state.muted ? 'muted' : 'live']
    : rule.when === 'late' ? rule.lines[RESUMED ? 'back' : state.lateJoin ? 'late' : 'early']
    : rule.when === 'cam' ? rule.lines[state.camOn && stream ? 'on' : 'off'] : rule.lines.filter(l => state.people.length > 1 || !l.includes('{other}'));
  /* Shuffle, but let the person who spoke last wait their turn. */
  const order = state.people.map((p, i) => i).sort(() => Math.random() - 0.5).sort((a, b) => (a === lastSender) - (b === lastSender));
  const count = Math.min(rule.who || 1, order.length, rule.who > 1 && Math.random() < 0.5 ? 2 : 1);
  const used = new Set();
  for (let k = 0; k < count; k++) {
    const p = state.people[order[k]];
    const other = state.people[order[(k + 1) % order.length]].name.split(/\s+/)[0];
    let line; do { line = pool[Math.floor(Math.random() * pool.length)]; } while (used.has(line) && used.size < pool.length);
    used.add(line);
    /* people read your message, think, then type at a normal speed; a second reply comes a little later */
    const start = 2500 + Math.random() * 5500 + k * (6000 + Math.random() * 6000), len = Math.min(1800 + line.length * 120, 9000);
    setTimeout(() => { if (state.ended) return; typing.add(p.name); showTyping(); }, start);
    if (k === 0) lastSender = order[0];
    setTimeout(() => { typing.delete(p.name); showTyping(); incoming(p, fill(line, other)); }, start + len);
  }
}
document.getElementById('chatForm').addEventListener('submit', e => {
  e.preventDefault(); const inp = document.getElementById('chatInput'); const t = inp.value.trim(); if (!t) return;
  addMsg(me + ' (You)', t, ME_AV); inp.value = '';
  replyTo(t);
});

/* ---------- actions ---------- */
function toggleMute() { state.muted = !state.muted; /* Hook for topic audio: mute or unmute our own clips here. */ render(); refreshPanels(); }

  /* Leave shortcuts: Teams Ctrl+Shift+H hangs up, Zoom Alt+Q opens the end options. */
  if (L === 'teams' && e.ctrlKey && e.shiftKey && k === 'h') { e.preventDefault(); leaveCall('left'); }
  if (L === 'zoom' && e.altKey && k === 'q') { e.preventDefault(); leaveOptions(shown('[data-leavemenu]')); }
  if ((L === 'teams' && e.ctrlKey && e.shiftKey && k === 'k') || (L === 'zoom' && e.altKey && k === 'y') || (L === 'meet' && (e.ctrlKey || e.metaKey) && e.altKey && k === 'h')) { e.preventDefault(); toggleHand(); }
});
addEventListener('resize', () => { closeMenu(); placeSides(); render(); });

/* ---------- start ---------- */
function applyLook() { C = palette(); styleSides(); styleToast(); render(); refreshPanels(); }
applyLook();
if (state.camOn) startCam();
if (params.get('skip') === '1') joinCall();   /* add &skip=1 to go straight into the call */
</script>
